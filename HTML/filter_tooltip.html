<!DOCTYPE html>
<html>
<head>
    <title>Grayscale Animation</title>

    <style>
        body {
            text-align: center;
        }

        img {
            width: 300px;
            height: 200px;

            animation: grayscaleEffect 3s infinite;
        }

        @keyframes grayscaleEffect {

            0% {
                filter: grayscale(0%);
            }

            50% {
                filter: grayscale(100%);
            }

            100% {
                filter: grayscale(0%);
            }
        }
    </style>
</head>

<body>

    <h1>Grayscale Animation</h1>

    <img src="https://media.istockphoto.com/id/814423752/photo/eye-of-model-with-colorful-art-make-up-close-up.jpg?s=612x612&w=0&k=20&c=l15OdMWjgCKycMMShP8UK94ELVlEGvt7GmB_esHWPYE=" alt="My Image">
</body>
</html>
