<html>
    <head>
        <title>Code</title>
        <style>
           main {
            width:100vw;
            height:500vw;
            text-align:center;
            background-color:bisque;
            padding: 20px;
            }
            h1{
                font-size: 50px;
                transform:translateX(200px);
                /* transition: transform 2s;
                transition-property: transform;
                transition-duration: 5s;
                transition-timing-function: ease-in-out;
                transition-delay: 3s; */
                transition: transform 5s ease-in-out 3s;
            }
            div{
                width: 100px;
                height: 100px;
                background-color: red;
                margin: auto;
                animation: cardUp 1s infinite alternate;
            }
            @keyframes cardUp {
                0%{
                    transform: scale(1.5);
                    opacity: 0;
                }
                25%{
                    transform: scale(2);
                    opacity: 0.5;
                }
                50%{
                    transform: scale(2.5);
                    opacity: 0.5;
                }
                75%{
                transform: scale(3);
                    opacity: 0.75;
                }
                100%{
                    transform: scale(3.5);;
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Transform transition</h1>
            <p>This is a single transform transition example.</p>

            <div></div>
        </main>
    </body>
</html>
