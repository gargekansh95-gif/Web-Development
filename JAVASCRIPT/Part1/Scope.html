     //1./ Global scope

        function outerFun() {

// 5.  //Baisc closure
function basicClosure(){
    const message='Ag performed closure';
    function innBasicClosure(){
        console.log(message);
    }
    return innBasicClosure;
}
var baisc = basicClosure();
    baisc();
    // 6.  // Closure closure
     function counterclosure() {
        var count = 0;

        function increment() {
            count++;
            console.log(count);
        }

        return increment;
    }

    const counterFun = counterclosure();

    counterFun();
    counterFun();
    counterFun();



    // IIFE (Immediately Invoked Function Expression)

    // BASIC IIFE
    (function() {
        console.log('IIFE');
    })();

    // IIFE with parameters
    (function(name,age){
        console.log({
        name:name,
        age:age
        })
    })('John', 30);

    // Arrowfunction IIFE
    ((name,age)=>{
        console.log({
        name:name,
        age:age
        })
    })('John', 30);

    // IIFE with privete variables
    (function() {
        var ifever=10;
        console.log('IIFE with private variable',ifever); 
    })();
